name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew runnable
        run: chmod +x gradlew

      - name: Build the app and run the tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortcutKeyboard-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

  # Puts the newest APK on the "Latest build" release page, so it can be downloaded on the phone.
  # Only for pushes to the default branch or the owner's working branch.
  release:
    name: Publish "Latest build"
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref_name == github.event.repository.default_branch ||
       github.ref_name == 'ccr-9a011e76-gr2sjh')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Never let two runs replace the release at the same time.
    concurrency:
      group: latest-build-release
      cancel-in-progress: false
    steps:
      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: ShortcutKeyboard-apk
          path: apk

      - name: Rename the APK
        run: |
          shopt -s nullglob
          files=(apk/*.apk)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one APK, found ${#files[@]}" >&2
            exit 1
          fi
          mv "${files[0]}" ShortcutKeyboard.apk

      - name: Replace the "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build ShortcutKeyboard.apk \
            --prerelease \
            --title "Latest build" \
            --notes "The newest Shortcut Keyboard app. On your phone, tap ShortcutKeyboard.apk below to download it, then open it to install. Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
